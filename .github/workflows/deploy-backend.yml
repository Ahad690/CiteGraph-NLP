name: Deploy Backend to Hetzner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/deploy_to_hetzner.ps1'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: 46.225.8.77
      HETZNER_USER: root
      REMOTE_DIR: /opt/citegraph-nlp/backend
      DATA_DIR: /opt/citegraph-nlp/data
      ENV_FILE: /opt/citegraph-nlp/.env
      CONTAINER_NAME: citegraph-api
      IMAGE_NAME: citegraph_backend
      PORT: 8002
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "HETZNER_SSH_KEY is not configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/hetzner_deploy_key"
          chmod 600 "$RUNNER_TEMP/hetzner_deploy_key"
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" -o BatchMode=yes "$HETZNER_USER@$HETZNER_HOST" "echo SSH connection ok"

      - name: Package Backend
        run: |
          set -euo pipefail
          tar -czf /tmp/citegraph-backend.tar.gz src requirements.txt Dockerfile .dockerignore .env.example

      - name: Upload Backend Bundle
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" "mkdir -p '$REMOTE_DIR' '$DATA_DIR'"
          scp -i "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz "$HETZNER_USER@$HETZNER_HOST:/tmp/citegraph-backend.tar.gz"

      - name: Deploy Backend
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' DATA_DIR='$DATA_DIR' ENV_FILE='$ENV_FILE' CONTAINER_NAME='$CONTAINER_NAME' IMAGE_NAME='$IMAGE_NAME' PORT='$PORT' bash -s" <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          mkdir -p "$REMOTE_DIR" "$DATA_DIR"
          tar -xzf /tmp/citegraph-backend.tar.gz -C "$REMOTE_DIR"
          rm -f /tmp/citegraph-backend.tar.gz

          if [ ! -f "$ENV_FILE" ]; then
            cp "$REMOTE_DIR/.env.example" "$ENV_FILE"
          fi

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io curl
            systemctl enable --now docker || true
          fi
          docker info >/dev/null

          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl
          fi

          cd "$REMOTE_DIR"
          docker build -t "$IMAGE_NAME" .
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${PORT}:8000" \
            --env-file "$ENV_FILE" \
            -v "${DATA_DIR}:/app/data" \
            "$IMAGE_NAME"

          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null
          docker ps --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker logs "$CONTAINER_NAME" --tail 20 2>&1

          # --- Add /citegraph route to Nginx (clean any previous broken state) ---
          NGINX_CONF=$(grep -rl 'hetzner-api' /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
          echo "=== Found config: $NGINX_CONF ==="

          if [ -n "$NGINX_CONF" ]; then
            # Clean up any prior backups left in sites-enabled (nginx loads them too)
            rm -f /etc/nginx/sites-enabled/*.bak.* /etc/nginx/sites-enabled/leadgen.bak.disabled
            # Backup to a safe location outside sites-enabled
            mkdir -p /etc/nginx/backups
            cp "$NGINX_CONF" "/etc/nginx/backups/$(basename "$NGINX_CONF").bak.$(date +%s)"

            # Write Python fix script
            cat > /tmp/fix_nginx.py <<'PYEOF'
          import sys
          CONF = sys.argv[1]
          with open(CONF) as f:
              content = f.read()
          lines = content.split('\n')
          # Step 1: remove all include lines for citegraph-proxy.conf
          lines = [l for l in lines if 'citegraph-proxy.conf' not in l]
          # Step 2: remove existing /citegraph/ location blocks with brace matching
          result = []
          i = 0
          while i < len(lines):
              if 'location /citegraph/' in lines[i] and '{' in lines[i]:
                  depth = lines[i].count('{') - lines[i].count('}')
                  i += 1
                  while i < len(lines) and depth > 0:
                      depth += lines[i].count('{') - lines[i].count('}')
                      i += 1
                  continue
              result.append(lines[i])
              i += 1
          # Step 3: insert clean /citegraph/ block after /penora/ block
          final = []
          in_penora = False
          depth = 0
          inserted = False
          new_block = [
              '',
              '    # === CiteGraph backend (port 8002) ===',
              '    location /citegraph/ {',
              '        proxy_pass http://127.0.0.1:8002/;',
              '        proxy_set_header Host $host;',
              '        proxy_set_header X-Real-IP $remote_addr;',
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;',
              '        proxy_set_header X-Forwarded-Proto $scheme;',
              '    }',
          ]
          for line in result:
              final.append(line)
              if inserted:
                  continue
              if 'location /penora/' in line and '{' in line:
                  in_penora = True
                  depth = line.count('{') - line.count('}')
              elif in_penora:
                  depth += line.count('{') - line.count('}')
                  if depth == 0:
                      in_penora = False
                      final.extend(new_block)
                      inserted = True
          with open(CONF, 'w') as f:
              f.write('\n'.join(final))
          print('OK: inserted /citegraph/ block' if inserted else 'WARN: /penora/ block not found')
          PYEOF

            python3 /tmp/fix_nginx.py "$NGINX_CONF"
            # Remove leftover include file from previous failed attempts
            rm -f /etc/nginx/citegraph-proxy.conf
            echo "=== Updated config ==="
            cat "$NGINX_CONF"
            nginx -t && systemctl reload nginx && echo "Nginx reloaded OK"
          else
            echo "ERROR: No nginx config found for hetzner-api"
            exit 1
          fi
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz
