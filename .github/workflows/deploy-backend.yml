name: Deploy Backend to Hetzner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/deploy_to_hetzner.ps1'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: 46.225.8.77
      HETZNER_USER: root
      REMOTE_DIR: /opt/citegraph-nlp/backend
      DATA_DIR: /opt/citegraph-nlp/data
      ENV_FILE: /opt/citegraph-nlp/.env
      CONTAINER_NAME: citegraph-api
      IMAGE_NAME: citegraph_backend
      PORT: 8002
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "HETZNER_SSH_KEY is not configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/hetzner_deploy_key"
          chmod 600 "$RUNNER_TEMP/hetzner_deploy_key"
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" -o BatchMode=yes "$HETZNER_USER@$HETZNER_HOST" "echo SSH connection ok"

      - name: Package Backend
        run: |
          set -euo pipefail
          tar -czf /tmp/citegraph-backend.tar.gz src requirements.txt Dockerfile .dockerignore .env.example

      - name: Upload Backend Bundle
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" "mkdir -p '$REMOTE_DIR' '$DATA_DIR'"
          scp -i "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz "$HETZNER_USER@$HETZNER_HOST:/tmp/citegraph-backend.tar.gz"

      - name: Deploy Backend
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' DATA_DIR='$DATA_DIR' ENV_FILE='$ENV_FILE' CONTAINER_NAME='$CONTAINER_NAME' IMAGE_NAME='$IMAGE_NAME' PORT='$PORT' bash -s" <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          mkdir -p "$REMOTE_DIR" "$DATA_DIR"
          tar -xzf /tmp/citegraph-backend.tar.gz -C "$REMOTE_DIR"
          rm -f /tmp/citegraph-backend.tar.gz

          if [ ! -f "$ENV_FILE" ]; then
            cp "$REMOTE_DIR/.env.example" "$ENV_FILE"
          fi

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io curl
            systemctl enable --now docker || true
          fi
          docker info >/dev/null

          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl
          fi

          cd "$REMOTE_DIR"
          docker build -t "$IMAGE_NAME" .
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${PORT}:8000" \
            --env-file "$ENV_FILE" \
            -v "${DATA_DIR}:/app/data" \
            "$IMAGE_NAME"

          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null
          docker ps --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker logs "$CONTAINER_NAME" --tail 20 2>&1

          # --- Add /citegraph route to Nginx ---
          NGINX_CONF=$(grep -rl 'hetzner-api.duckdns.org' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1)
          if [ -n "$NGINX_CONF" ] && ! grep -q citegraph "$NGINX_CONF"; then
            # Insert /citegraph location block before the last closing brace
            awk '/location.*citegraph/{found=1} !found && /^[[:space:]]*\}[[:space:]]*$/{print "    location /citegraph/ {"; print "        proxy_pass http://127.0.0.1:8002/;"; print "        proxy_set_header Host $host;"; print "        proxy_set_header X-Real-IP $remote_addr;"; print "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;"; print "        proxy_set_header X-Forwarded-Proto $scheme;"; print "    }"; found=1} {print}' "$NGINX_CONF" > /tmp/nginx_citegraph.conf
            mv /tmp/nginx_citegraph.conf "$NGINX_CONF"
            nginx -t && systemctl reload nginx
            echo "Added /citegraph route to Nginx ($NGINX_CONF)"
          elif [ -n "$NGINX_CONF" ]; then
            echo "Nginx /citegraph route already exists in $NGINX_CONF"
          else
            echo "No Nginx config found for hetzner-api.duckdns.org"
          fi
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz
