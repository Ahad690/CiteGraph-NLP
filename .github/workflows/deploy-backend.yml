name: Deploy Backend to Hetzner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/deploy_to_hetzner.ps1'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prefer the secret so the host can be repointed without a code change.
      # The fallback is penora-prod-2; the previous box (46.225.8.77) was
      # deleted on 2026-05-31.
      HETZNER_HOST: ${{ secrets.HETZNER_HOST || '167.233.240.132' }}
      HETZNER_USER: root
      REMOTE_DIR: /opt/citegraph-nlp/backend
      DATA_DIR: /opt/citegraph-nlp/data
      ENV_FILE: /opt/citegraph-nlp/.env
      CONTAINER_NAME: citegraph-api
      IMAGE_NAME: citegraph-api
      # Loopback-only. The box is shared with four other projects and every
      # app port is bound to 127.0.0.1 behind nginx; 18020 is already taken by
      # terminux, so CiteGraph uses 18030.
      BIND_ADDR: 127.0.0.1
      PORT: 18030
      PUBLIC_ORIGIN: https://citegraph-nlp.pages.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "HETZNER_SSH_KEY is not configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/hetzner_deploy_key"
          chmod 600 "$RUNNER_TEMP/hetzner_deploy_key"
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" -o BatchMode=yes "$HETZNER_USER@$HETZNER_HOST" "echo SSH connection ok"

      - name: Package Backend
        run: |
          set -euo pipefail
          tar -czf /tmp/citegraph-backend.tar.gz \
            src requirements.txt Dockerfile .dockerignore .env.example \
            scripts/add_citegraph_route.py

      - name: Upload Backend Bundle
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" "mkdir -p '$REMOTE_DIR' '$DATA_DIR'"
          scp -i "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz "$HETZNER_USER@$HETZNER_HOST:/tmp/citegraph-backend.tar.gz"

      - name: Deploy Backend
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hetzner_deploy_key" "$HETZNER_USER@$HETZNER_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' DATA_DIR='$DATA_DIR' ENV_FILE='$ENV_FILE' CONTAINER_NAME='$CONTAINER_NAME' IMAGE_NAME='$IMAGE_NAME' BIND_ADDR='$BIND_ADDR' PORT='$PORT' PUBLIC_ORIGIN='$PUBLIC_ORIGIN' bash -s" <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          mkdir -p "$REMOTE_DIR" "$DATA_DIR"
          tar -xzf /tmp/citegraph-backend.tar.gz -C "$REMOTE_DIR"
          rm -f /tmp/citegraph-backend.tar.gz

          if [ ! -f "$ENV_FILE" ]; then
            cp "$REMOTE_DIR/.env.example" "$ENV_FILE"
          fi

          # Replace the OpenAlex placeholder email with the real one if it's
          # still set to the example value. Preserves any other manual edits.
          if grep -q '^OPENALEX_EMAIL=your_email@example.com' "$ENV_FILE"; then
            sed -i 's|^OPENALEX_EMAIL=your_email@example.com|OPENALEX_EMAIL=muhammadahadf23@nutech.edu.pk|' "$ENV_FILE"
            echo "Updated OPENALEX_EMAIL in $ENV_FILE"
          fi

          # Pin the production-only settings, replacing any earlier value so a
          # stale .env from the previous box cannot silently win. CORS_ORIGINS
          # must list the Pages origin or the browser blocks every API call.
          set_env_key() {
            local key="$1" value="$2"
            if grep -q "^${key}=" "$ENV_FILE"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }
          set_env_key APP_ENV production
          set_env_key CORS_ORIGINS "$PUBLIC_ORIGIN"
          set_env_key DATA_DIR /app/data
          set_env_key SQLITE_PATH /app/data/cache/citegraph.sqlite
          # No GROBID service runs on this box; PDF parsing is not wired up.
          set_env_key ENABLE_GROBID false

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io curl
            systemctl enable --now docker || true
          fi
          docker info >/dev/null

          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl
          fi

          cd "$REMOTE_DIR"
          docker build -t "$IMAGE_NAME" .
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          # Bind to the loopback address explicitly. "-p 18030:8000" would
          # publish on 0.0.0.0 and expose the API to the internet, bypassing
          # nginx and TLS on a box that is shared with four other projects.
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${BIND_ADDR}:${PORT}:8000" \
            --env-file "$ENV_FILE" \
            -v "${DATA_DIR}:/app/data" \
            "$IMAGE_NAME"

          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null

          # Fail the deploy if the port ended up reachable on a public address.
          if ss -ltn "sport = :${PORT}" | grep -qE '0\.0\.0\.0:|\[::\]:'; then
            echo "ERROR: ${PORT} is published on a public interface, not loopback."
            exit 1
          fi
          docker ps --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker logs "$CONTAINER_NAME" --tail 20 2>&1

          # --- Add /citegraph route to Nginx (idempotent, with rollback) ---
          # Clean stray backups in sites-enabled (Nginx loads them too).
          # Log each deleted file for observability.
          find /etc/nginx/sites-enabled/ -maxdepth 1 \
               \( -name '*.bak.*' -o -name '*.bak.disabled' \) \
               -print -delete 2>/dev/null || true

          # Find the active config in either sites-enabled/ or conf.d/.
          NGINX_CONF=$(grep -rl 'hetzner-api' \
                          /etc/nginx/sites-enabled/ \
                          /etc/nginx/conf.d/ \
                          2>/dev/null | grep -v '\.bak' | head -1 || true)
          if [ -z "$NGINX_CONF" ] || [ ! -f "$NGINX_CONF" ]; then
            echo "ERROR: No Nginx config containing 'hetzner-api' found in sites-enabled/ or conf.d/" >&2
            exit 1
          fi
          echo "Found active config: $NGINX_CONF"

          # Bounded backup retention: timestamped backups in /etc/nginx/backups,
          # keep at most the 10 most recent.
          mkdir -p /etc/nginx/backups
          BACKUP_PATH="/etc/nginx/backups/$(basename "$NGINX_CONF").bak.$(date +%s)"
          cp "$NGINX_CONF" "$BACKUP_PATH"
          echo "Backed up to $BACKUP_PATH"
          ls -1t /etc/nginx/backups/*.bak.* 2>/dev/null \
            | tail -n +11 \
            | xargs -r rm -v

          # Remove leftover legacy include file from earlier failed attempts.
          rm -f /etc/nginx/citegraph-proxy.conf

          # Edit a temp copy so an aborted script never leaves a broken active config.
          TMP_CONF="$(mktemp)"
          cp "$NGINX_CONF" "$TMP_CONF"

          # Run the route-insertion helper against the temp copy.
          if ! python3 "$REMOTE_DIR/scripts/add_citegraph_route.py" "$TMP_CONF"; then
            rc=$?
            echo "ERROR: add_citegraph_route.py failed (exit=$rc); active config left untouched." >&2
            rm -f "$TMP_CONF"
            exit "$rc"
          fi

          # Print just the citegraph block we added — not the whole file — for safe CI logs.
          echo "--- inserted /citegraph/ block ---"
          grep -n -A 7 'location /citegraph/' "$TMP_CONF" || true
          echo "----------------------------------"

          # Swap atomically: replace the live config, run nginx -t, restore on failure.
          cp "$TMP_CONF" "$NGINX_CONF"
          rm -f "$TMP_CONF"
          if ! nginx -t; then
            echo "ERROR: nginx -t rejected the new config; restoring backup $BACKUP_PATH" >&2
            cp "$BACKUP_PATH" "$NGINX_CONF"
            nginx -t  # confirm the restore parses
            exit 1
          fi
          systemctl reload nginx
          echo "Nginx reloaded with /citegraph/ route"

          # Live smoke test: verify TLS termination + /citegraph proxying.
          # Use --resolve so transient public DNS issues on the host do not
          # cause false deploy failures.
          PROXY_DOMAIN="hetzner-api.duckdns.org"
          PROXY_HEALTH_URL="https://${PROXY_DOMAIN}/citegraph/health"
          if ! curl -fsS --max-time 15 --retry 3 --retry-delay 2 \
                --resolve "${PROXY_DOMAIN}:443:127.0.0.1" \
                "$PROXY_HEALTH_URL" >/dev/null; then
            echo "ERROR: post-deploy health check via HTTPS proxy failed; restoring backup" >&2
            cp "$BACKUP_PATH" "$NGINX_CONF"
            systemctl reload nginx || true
            exit 1
          fi
          echo "Live HTTPS /citegraph/health check OK"
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/hetzner_deploy_key" /tmp/citegraph-backend.tar.gz
