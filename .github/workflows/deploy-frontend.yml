name: Deploy Frontend to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./frontend
        env:
          # Baked into the bundle at build time, so this must be the live API
          # host. The old hetzner-api.duckdns.org pointed at a deleted box.
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://citegraph-api.penora.us' }}
        run: npm run build

      - name: Verify Frontend Build Artifacts
        working-directory: ./frontend
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -d dist/client/assets
          grep -q '\$_TSR' dist/client/index.html

          # The API base is inlined by Vite; if it is missing, the deployed site
          # would silently fall back to http://localhost:8000 in every browser.
          api_base="${VITE_API_BASE:-https://citegraph-api.penora.us}"
          if ! grep -rqF "$api_base" dist/client/assets; then
            echo "ERROR: $api_base was not baked into the bundle."
            exit 1
          fi
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://citegraph-api.penora.us' }}

      - name: Add SPA fallback for client-side routes
        working-directory: ./frontend
        run: |
          set -euo pipefail
          # Without this, a deep link such as /dashboard/<run-id> 404s on Pages
          # because no file exists at that path.
          printf '/*    /index.html   200\n' > dist/client/_redirects
          cat dist/client/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./frontend
          command: >-
            pages deploy dist/client
            --project-name citegraph-nlp
            --branch main
