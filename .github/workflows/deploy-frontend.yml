name: Deploy Frontend and Landing Page to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE: ${{ secrets.BACKEND_DOMAIN && format('https://{0}', secrets.BACKEND_DOMAIN) || 'http://46.225.8.77:8002' }}
        run: npm run build

      - name: Verify Frontend Build Artifacts
        working-directory: ./frontend
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -d dist/client/assets
          grep -q '\$_TSR' dist/client/index.html

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CITEGRAPH_NLP1 }}
          channelId: live
          projectId: citegraph-nlp1
