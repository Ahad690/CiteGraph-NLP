name: Tests

# The whole suite, including tests/test_the_thesis_does_not_drift.py, which
# checks the thesis against the code, the evidence files and the committed PDFs.
# It installs requirements.txt rather than a minimal set because the drift
# guard's test-count check only runs when every test file collects.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards shell out to git (tracked-file checks, the ancestor check
          # in scripts/check_deployed_build.py), and a depth-1 clone answers
          # those questions wrongly. Terminus C1.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      # --cov-fail-under is a ratchet, not a target: 76 is the measured floor on
      # main (2082/2732 lines). It exists so coverage cannot silently regress,
      # and it must be raised as coverage improves -- never lowered to make a
      # red run green. The aspirational target is 80; see
      # commands/test-coverage.md for the per-module table.
      # --cov-branch is not optional: without it the Cobertura XML carries no
      # condition-coverage data and branch coverage reads as "none".
      - name: pytest
        run: >-
          python -m pytest -q
          --junitxml=reports/junit.xml
          --cov=src/citegraph
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term:skip-covered
          --cov-fail-under=76

      # A green run says nothing unless it is shown to have run something: the
      # run that was green while the suite and the guard against it were both
      # skipped by one missing credential. This step is deliberately not
      # conditional, and the reader lives in scripts/ rather than in tests/, so
      # the suite carries no skip that this step would then refuse.
      - name: Prove the suite ran
        run: python scripts/check_test_report.py
        env:
          CITEGRAPH_JUNIT_XML: reports/junit.xml

      # A coverage gate that can pass without producing a report is the same
      # failure mode as a glob that matches nothing and exits 0. This step
      # refuses to let that happen: the file must exist and describe real
      # statements, or the run is red regardless of pytest's exit code.
      - name: Prove the coverage report is real
        run: python scripts/check_coverage_report.py
        env:
          CITEGRAPH_COVERAGE_XML: coverage.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: error

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
