name: Tests

# The whole suite, including tests/test_the_thesis_does_not_drift.py, which
# checks the thesis against the code, the evidence files and the committed PDFs.
# It installs requirements.txt rather than a minimal set because the drift
# guard's test-count check only runs when every test file collects.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards shell out to git (tracked-file checks, the ancestor check
          # in scripts/check_deployed_build.py), and a depth-1 clone answers
          # those questions wrongly. Terminus C1.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      # --cov-fail-under is a ratchet, not a target, and it must be derived from
      # a run configured exactly like this one. Measured on CI after the two
      # model providers landed: 3206 stmts / 595 missed / 1094 branches /
      # 156 partial = 77.60% combined. The floor is 77, one point below the
      # measurement, so a small unrelated removal cannot flip the build while a
      # real regression still cannot pass.
      #
      # It was 72 against 72.64% before that. It is raised as coverage improves
      # and never lowered to turn a red run green; the earlier note about 76%
      # being the statement-only figure is kept below because the reasoning still
      # applies to anyone tempted to quote a number from a different run.
      #
      # --cov-branch is not optional: without it the Cobertura XML carries no
      # condition-coverage data and branch coverage reads as "none".
      - name: pytest
        run: >-
          python -m pytest -q
          --junitxml=reports/junit.xml
          --cov=src/citegraph
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term:skip-covered
          --cov-fail-under=77

      # A green run says nothing unless it is shown to have run something: the
      # run that was green while the suite and the guard against it were both
      # skipped by one missing credential. This step is deliberately not
      # conditional, and the reader lives in scripts/ rather than in tests/, so
      # the suite carries no skip that this step would then refuse.
      - name: Prove the suite ran
        run: python scripts/check_test_report.py
        env:
          CITEGRAPH_JUNIT_XML: reports/junit.xml

      # A coverage gate that can pass without producing a report is the same
      # failure mode as a glob that matches nothing and exits 0. This step
      # refuses to let that happen: the file must exist and describe real
      # statements, or the run is red regardless of pytest's exit code.
      - name: Prove the coverage report is real
        run: python scripts/check_coverage_report.py
        env:
          CITEGRAPH_COVERAGE_XML: coverage.xml
      # Note the guard checks that the report is real; it deliberately does not
      # decide pass/fail, because --cov-fail-under belongs to the run that
      # produced the numbers and the two must not drift apart.

      # A secrets check that only ever runs on one machine is a machine that
      # goes unbacked up and a key that stays committed once written. The gate
      # runs here so a leak is a red build rather than something a reader
      # notices on GitHub.
      - name: No credential is committed
        run: python scripts/check_secrets_gate.py

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: error

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
