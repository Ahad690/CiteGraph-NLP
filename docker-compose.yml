version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citegraph-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      ENABLE_OPENALEX: "true"
      ENABLE_CROSSREF: "true"
      ENABLE_EUROPE_PMC: "true"
      DATA_DIR: /app/data
      SQLITE_PATH: /app/data/cache/citegraph.sqlite
      GROBID_URL: http://grobid:8070
      ENABLE_GROBID: "true"
      DEFAULT_BACKWARD_DEPTH: "2"
      DEFAULT_FORWARD_DEPTH: "1"
      DEFAULT_MAX_TOTAL_PAPERS: "100"
      WEIGHT_ALPHA: "0.75"
      WEIGHT_BETA: "0.25"
      N_REFERENCE: "100000"
    volumes:
      - citegraph_data:/app/data
    depends_on:
      - grobid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citegraph-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: citegraph-grobid
    ports:
      - "8070:8070"

  neo4j:
    image: neo4j:5-community
    container_name: citegraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    profiles:
      - neo4j

volumes:
  citegraph_data:
  neo4j_data:
