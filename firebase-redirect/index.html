<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CiteGraph-NLP has moved</title>
    <!-- Belt and braces: the 301 in firebase.json handles this server-side,
         but a meta refresh covers any cached response that slips through. -->
    <meta http-equiv="refresh" content="0; url=https://citegraph-nlp.pages.dev/" />
    <link rel="canonical" href="https://citegraph-nlp.pages.dev/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e7ecf5;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      a { color: #6ee7ff; }
      .muted { color: #93a1bd; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>CiteGraph-NLP has moved</h1>
      <p>
        This project is now hosted at
        <a href="https://citegraph-nlp.pages.dev/">citegraph-nlp.pages.dev</a>.
      </p>
      <p class="muted">Redirecting you automatically&hellip;</p>
    </main>
  </body>
</html>
